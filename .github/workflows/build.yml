name: Build & Package YouTube RVX

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      youtube_version:
        description: 'Pilih Versi YouTube (recommended / versi spesifik seperti 21.13.164)'
        required: true
        default: 'recommended'
        type: string
      patch_source:
        description: 'Sumber Patch'
        required: true
        default: 'anddea'
        type: choice
        options:
          - anddea
          - morphe
          - inotia00
          - revanced
      patch_tag:
        description: 'Channel / Tag Versi Patch (dev, latest, atau tag seperti v4.3.0)'
        required: true
        default: 'dev'
        type: string
      arch:
        description: 'Target Arsitektur APK (all / arm64-v8a)'
        required: false
        default: 'all'
        type: string
      build_mode:
        description: 'Mode Build (Uji Coba vs Publikasi Resmi)'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - release

  repository_dispatch:
    types: [build-rvx]

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Utilities & Python Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zip unzip curl
          python3 -m pip install -q packaging requests beautifulsoup4

      - name: Extract Dynamic Configuration Payload
        id: params
        run: |
          CONFIG_FILE="build_out/dynamic_config.json"
          mkdir -p build_out

          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "📥 Membaca konfigurasi dari Web Dashboard (repository_dispatch)..."
            VERSION="${{ github.event.client_payload.youtube_version }}"
            SOURCE="${{ github.event.client_payload.patch_source }}"
            TAG="${{ github.event.client_payload.patch_tag }}"
            MODE="${{ github.event.client_payload.build_mode }}"
            
            # Simpan payload lengkap (patch choices, options) ke dynamic_config.json
            echo '${{ toJson(github.event.client_payload) }}' > "$CONFIG_FILE"
          else
            echo "📥 Membaca konfigurasi dari Form GitHub (workflow_dispatch)..."
            VERSION="${{ inputs.youtube_version }}"
            SOURCE="${{ inputs.patch_source }}"
            TAG="${{ inputs.patch_tag }}"
            MODE="${{ inputs.build_mode }}"
            
            # Gunakan config/golden-preset.json sebagai dasar
            cp config/golden-preset.json "$CONFIG_FILE"
          fi

          VERSION=${VERSION:-recommended}
          SOURCE=${SOURCE:-anddea}
          TAG=${TAG:-dev}
          MODE=${MODE:-test}

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "source=$SOURCE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "config=$CONFIG_FILE" >> $GITHUB_OUTPUT

      - name: Run Build Script
        run: |
          chmod +x tools/*.sh
          bash tools/build-module.sh \
            "${{ steps.params.outputs.version }}" \
            "${{ steps.params.outputs.source }}" \
            "${{ steps.params.outputs.tag }}" \
            "${{ steps.params.outputs.mode }}" \
            "${{ steps.params.outputs.config }}"

      - name: Upload Test Artifacts (Mode Uji Coba)
        if: steps.params.outputs.mode == 'test'
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-RVX-Test-Artifacts
          path: |
            build_out/*.apk
            build_out/*.zip
            build_out/*.log
            build_out/*_args.txt
          retention-days: 7

      - name: Publish Official Release (Mode Rilis)
        if: steps.params.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODULE_ZIP=$(ls build_out/YouTube.RVX.v*.zip | head -n 1)
          NONROOT_APK=$(ls build_out/YouTube.RVX.v*-NonRoot.apk | head -n 1)
          VERSION_TAG=$(basename "$MODULE_ZIP" .zip | sed 's/YouTube.RVX.//')
          RELEASE_TITLE="$VERSION_TAG"
          
          NOTES="### Update\n- YouTube RVX $VERSION_TAG\n- Patched with Morphe CLI & ${{ steps.params.outputs.source }} Patches\n- Root Module and Non-Root APK included\n\n### Fix & Problem\n- For Non-Root, use latest GmsCore/MicroG.\n- For Root, flash via Magisk / KernelSU / APatch."

          echo "🚀 Menerbitkan rilis resmi: $VERSION_TAG"
          gh release create "$VERSION_TAG" "$MODULE_ZIP" "$NONROOT_APK" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES"
