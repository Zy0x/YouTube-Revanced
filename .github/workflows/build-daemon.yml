name: Build & Package RVX Daemon and Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'daemon/**'
      - 'web/**'
      - 'android/**'
      - '.github/workflows/build-daemon.yml'

jobs:
  build-all:
    name: Build Daemon, Root Module & Non-Root APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build rvx-daemon for Android ARM64
        run: |
          mkdir -p bin
          cd daemon
          cargo ndk -t arm64-v8a build --release
          cd ..
          cp daemon/target/aarch64-linux-android/release/rvx-daemon bin/rvx-daemon
          chmod +x bin/rvx-daemon
          ls -lh bin/rvx-daemon

      - name: Package Root Module ZIP
        run: |
          zip -r9 YouTube-RVX-Root-Module.zip module.prop customize.sh service.sh action.sh uninstall.sh META-INF bin webroot

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Assemble Non-Root APK
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/assets/bin
          cp bin/rvx-daemon android/app/src/main/jniLibs/arm64-v8a/librvx_daemon.so
          cp bin/rvx-daemon android/app/src/main/assets/bin/rvx-daemon
          cd android
          gradle assembleDebug --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk RVX-Patcher-Manager.apk
          ls -lh RVX-Patcher-Manager.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RVX-Dual-Release-v2.1.25
          path: |
            bin/rvx-daemon
            YouTube-RVX-Root-Module.zip
            RVX-Patcher-Manager.apk
          if-no-files-found: error
