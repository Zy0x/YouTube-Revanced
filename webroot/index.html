<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YouTube RVX WebUI</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #appFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    #loadingFallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #ffffff;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ef4444;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn-retry {
      margin-top: 16px;
      min-height: 48px;
      padding: 10px 24px;
      background-color: #ef4444;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <iframe id="appFrame" src="http://127.0.0.1:8080" style="display:none;"></iframe>
  <div id="loadingFallback">
    <div class="spinner"></div>
    <h2>Connecting to RVX Patcher Daemon...</h2>
    <p style="color: #9ca3af; font-size: 0.9rem; max-width: 320px;">
      Connecting to local daemon on http://127.0.0.1:8080. If the daemon is starting up, this will load automatically.
    </p>
    <button type="button" class="btn-retry" onclick="reloadFrame()">Retry Connection</button>
  </div>

  <script>
    const iframe = document.getElementById('appFrame');
    const fallback = document.getElementById('loadingFallback');

    function checkConnection() {
      fetch('http://127.0.0.1:8080/api/v1/system/status', { signal: AbortSignal.timeout(2000) })
        .then(res => {
          if (res.ok) {
            iframe.style.display = 'block';
            fallback.style.display = 'none';
          } else {
            setTimeout(checkConnection, 1500);
          }
        })
        .catch(() => {
          setTimeout(checkConnection, 2000);
        });
    }

    function reloadFrame() {
      iframe.src = 'http://127.0.0.1:8080?' + Date.now();
      checkConnection();
    }

    iframe.onload = () => {
      iframe.style.display = 'block';
      fallback.style.display = 'none';
    };

    checkConnection();
  </script>
</body>
</html>
