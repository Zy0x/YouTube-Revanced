<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YouTube RVX WebUI</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #appFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    #loadingFallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #ffffff;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ef4444;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn-retry {
      margin-top: 16px;
      min-height: 48px;
      padding: 10px 24px;
      background-color: #ef4444;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <iframe id="appFrame" src="" style="display:none;"></iframe>
  <div id="loadingFallback">
    <div class="spinner"></div>
    <h2>Connecting to RVX Patcher Daemon...</h2>
    <p id="statusHint" style="color: #9ca3af; font-size: 0.9rem; max-width: 340px;">
      Connecting to local RVX daemon on port 8088...
    </p>
    <button type="button" class="btn-retry" onclick="checkConnection()">Retry Connection</button>
  </div>

  <script>
    const iframe = document.getElementById('appFrame');
    const fallback = document.getElementById('loadingFallback');
    const statusHint = document.getElementById('statusHint');

    // Candidate ports (8088 default, never conflict with Lynx Kernel Manager 8080)
    const CANDIDATE_PORTS = [8088, 8089, 8090, 8280, 8080];

    async function probePort(port) {
      try {
        const res = await fetch(`http://127.0.0.1:${port}/api/v1/system/status`, {
          signal: AbortSignal.timeout(1200)
        });
        if (res.ok) {
          const data = await res.json();
          // Verify RVX Daemon signature so other web services like Lynx Kernel Manager are ignored
          if (data && (data.jre_ready !== undefined || data.daemon_version !== undefined)) {
            return `http://127.0.0.1:${port}`;
          }
        }
      } catch (_) {}
      return null;
    }

    async function checkConnection() {
      if (statusHint) statusHint.textContent = 'Probing RVX daemon on port 8088...';
      for (const port of CANDIDATE_PORTS) {
        const url = await probePort(port);
        if (url) {
          iframe.src = url;
          iframe.style.display = 'block';
          fallback.style.display = 'none';
          return;
        }
      }
      if (statusHint) {
        statusHint.textContent = 'Daemon starting up. Checking again shortly...';
      }
      setTimeout(checkConnection, 2000);
    }

    iframe.onload = () => {
      if (iframe.src && iframe.src !== 'about:blank') {
        iframe.style.display = 'block';
        fallback.style.display = 'none';
      }
    };

    checkConnection();
  </script>
</body>
</html>
